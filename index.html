<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Integración de Sistemas</title>
<meta name="theme-color" content="#12131A" />
<meta name="description" content="Apuntes, cuestionarios de autoevaluación y glosario de Integración de Sistemas." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <span class="topbar__mark" aria-hidden="true">●</span>
    <span class="topbar__title">Integración de Sistemas</span>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button class="tab" data-view="notes" type="button" aria-current="page">
      <svg viewBox="0 0 24 24" class="tab__icon" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span>Apuntes</span>
    </button>
    <button class="tab" data-view="quiz" type="button">
      <svg viewBox="0 0 24 24" class="tab__icon" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
      <span>Cuestionario</span>
    </button>
    <button class="tab" data-view="cases" type="button">
      <svg viewBox="0 0 24 24" class="tab__icon" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
      <span>Casos</span>
    </button>
    <button class="tab" data-view="glossary" type="button">
      <svg viewBox="0 0 24 24" class="tab__icon" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V5H6.5A2.5 2.5 0 0 0 4 7.5v12Z"/><path d="M4 19.5V7.5"/></svg>
      <span>Glosario</span>
    </button>
  </nav>

</div>

<!-- Plantillas -->
<template id="tpl-notes">
  <div class="panel">
    <p class="panel__eyebrow mono">MATERIAL</p>
    <h1 class="panel__title">Apuntes</h1>
    <ul class="accordion" id="notes-list"></ul>
  </div>
</template>

<template id="tpl-note-item">
  <li class="accordion__item">
    <button class="accordion__head" type="button" aria-expanded="false">
      <span class="accordion__title"></span>
      <span class="accordion__chevron" aria-hidden="true">⌄</span>
    </button>
    <div class="accordion__body" hidden>
      <p></p>
    </div>
  </li>
</template>

<template id="tpl-cases">
  <div class="panel">
    <p class="panel__eyebrow mono">PARA DEBATIR EN CLASE</p>
    <h1 class="panel__title">Casos</h1>
    <p class="panel__lead panel__lead--left">No tienen una única respuesta correcta. Léanlos en grupo, discutan las preguntas guía y propongan una solución fundamentada.</p>
    <ul class="accordion" id="cases-list"></ul>
  </div>
</template>

<template id="tpl-case-item">
  <li class="accordion__item">
    <button class="accordion__head" type="button" aria-expanded="false">
      <span class="accordion__title"></span>
      <span class="accordion__chevron" aria-hidden="true">⌄</span>
    </button>
    <div class="accordion__body" hidden>
      <p class="case__scenario"></p>
      <p class="case__label mono">PREGUNTAS PARA DEBATIR</p>
      <ul class="case__questions"></ul>
    </div>
  </li>
</template>

<template id="tpl-glossary">
  <div class="panel">
    <p class="panel__eyebrow mono">TÉRMINOS CLAVE</p>
    <h1 class="panel__title">Glosario</h1>
    <input type="search" id="glossary-search" class="search" placeholder="Buscar término…" />
    <ul class="glossary-list" id="glossary-list"></ul>
  </div>
</template>

<template id="tpl-glossary-item">
  <li class="glossary-item">
    <p class="glossary-item__term"></p>
    <p class="glossary-item__def"></p>
  </li>
</template>

<!-- Quiz (reutiliza la estética del cuestionario standalone) -->
<template id="tpl-quiz-intro">
  <div class="panel panel--center">
    <p class="panel__eyebrow mono">AUTOEVALUACIÓN</p>
    <h1 class="panel__title">Cuestionario</h1>
    <p class="panel__lead">10 preguntas de opción única sobre Integración de Sistemas. Podés repetirlo las veces que quieras.</p>
    <button id="btn-start-quiz" class="btn btn--primary" type="button">Empezar</button>
  </div>
</template>

<template id="tpl-question">
  <div class="question">
    <div class="track"><div class="track__fill" id="progress-fill"></div></div>
    <p class="question__eyebrow mono">PREGUNTA <span class="q-index"></span> / <span class="q-total"></span></p>
    <h2 class="question__text"></h2>
    <ul class="options" role="listbox"></ul>
    <div class="question__nav">
      <button id="btn-prev" class="btn btn--ghost" type="button">Anterior</button>
      <button id="btn-next" class="btn btn--primary" type="button">Siguiente</button>
    </div>
  </div>
</template>

<template id="tpl-option">
  <li class="option" role="option" aria-selected="false" tabindex="0">
    <span class="option__bubble" aria-hidden="true"></span>
    <span class="option__label"></span>
  </li>
</template>

<template id="tpl-result">
  <div class="result">
    <p class="result__eyebrow mono">RESULTADO</p>
    <p class="result__score"><span class="result__score-num"></span><span class="result__score-den"></span></p>
    <p class="result__pct mono"></p>
    <ul class="result__list"></ul>
    <button id="btn-retry" class="btn btn--primary" type="button">Volver a intentar</button>
  </div>
</template>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
