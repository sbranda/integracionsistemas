<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Integración de Sistemas · Cuestionario</title>
<meta name="description" content="App de estudio: apuntes, cuestionario, casos de debate y glosario de Integración de Sistemas." />
<meta name="theme-color" content="#0f1720" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Integración" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== SPLASH SCREEN ===== -->
<div id="splash" class="splash">
  <div class="splash__inner">
    <img src="icon-512.png" alt="" class="splash__icon" />
    <div class="splash__title">INTEGRACIÓN</div>
    <div class="splash__subtitle">DE SISTEMAS</div>
    <div class="splash__progress"><div class="splash__progress-bar" id="splash-progress-bar"></div></div>
  </div>
</div>

<div class="app-shell">
  <header class="topbar">
    <div class="topbar__heading">
      <div class="topbar__title">INTEGRACIÓN</div>
      <div class="topbar__subtitle">DE SISTEMAS</div>
      <div class="topbar__description">in·te·gra·ción de sis·te·mas — hacer que programas distintos trabajen juntos e intercambien información.</div>
    </div>
    <div class="topbar__actions">
      <button type="button" class="icon-btn" id="btn-search" aria-label="Buscar">🔍</button>
      <button type="button" class="icon-btn" id="btn-theme" aria-label="Cambiar tema">🎨</button>
      <button type="button" class="icon-btn" id="btn-font" aria-label="Tamaño de letra">Aa</button>
    </div>
  </header>

  <div class="settings-panel" id="theme-panel" hidden>
    <button type="button" class="settings-panel__btn" data-theme-choice="dark">Oscuro</button>
    <button type="button" class="settings-panel__btn" data-theme-choice="light">Claro</button>
    <button type="button" class="settings-panel__btn" data-theme-choice="contrast">Alto contraste</button>
  </div>

  <div class="settings-panel" id="font-panel" hidden>
    <button type="button" class="settings-panel__btn" data-font-choice="0.9">Chico</button>
    <button type="button" class="settings-panel__btn" data-font-choice="1">Normal</button>
    <button type="button" class="settings-panel__btn" data-font-choice="1.15">Grande</button>
    <button type="button" class="settings-panel__btn" data-font-choice="1.35">Muy grande</button>
  </div>

  <div class="search-panel" id="search-panel" hidden>
    <input type="search" id="search-input" placeholder="Buscar en apuntes, casos, glosario y preguntas..." />
    <button type="button" class="icon-btn" id="btn-search-close" aria-label="Cerrar búsqueda">✕</button>
    <div class="search-results" id="search-results"></div>
  </div>

  <div id="install-banner" class="install-banner" hidden>
    <span id="install-banner-text">Instalá esta app en tu celular o compu para acceder más rápido.</span>
    <div class="install-banner__actions">
      <button type="button" class="btn btn--primary" id="btn-install">Instalar</button>
      <button type="button" class="btn btn--ghost" id="btn-install-dismiss">Ahora no</button>
    </div>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <button type="button" class="scroll-top-btn" id="btn-scroll-top" hidden aria-label="Volver arriba">↑</button>

  <nav class="tabbar">
    <button type="button" class="tab" data-tab="notes">
      <span class="tab__icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="1.5"/><path d="M8 9h8M8 13h8M8 17h4" stroke="currentColor" stroke-width="1.5"/></svg>
        <span id="notes-tab-badge" class="tab__badge" hidden></span>
      </span>
      <span>Apuntes</span>
    </button>
    <button type="button" class="tab" data-tab="quiz">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 9a3 3 0 116 0c0 2-3 2-3 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="17" r="0.8" fill="currentColor"/></svg>
      <span>Cuestionario</span>
    </button>
    <button type="button" class="tab" data-tab="cases">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Casos</span>
    </button>
    <button type="button" class="tab" data-tab="glossary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 4h11a2 2 0 012 2v14H7a2 2 0 01-2-2V4z" stroke="currentColor" stroke-width="1.5"/><path d="M5 16h13" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Glosario</span>
    </button>
  </nav>
</div>

<!-- ===== TEMPLATES ===== -->

<template id="tpl-notes">
  <section class="screen">
    <h1 class="screen__title">Apuntes</h1>
    <div class="progress-summary">
      <div class="progress-summary__stat"><span id="stat-notes-read">0/0</span><small>Apuntes leídos</small></div>
      <div class="progress-summary__stat"><span id="stat-best-score">—</span><small>Mejor puntaje</small></div>
      <div class="progress-summary__stat"><span id="stat-cases-viewed">0/0</span><small>Casos vistos</small></div>
    </div>
    <a href="#" class="reset-progress-link" id="btn-reset-progress">Reiniciar progreso</a>
    <button type="button" class="btn btn--ghost btn--block" id="btn-export-notes-pdf">Exportar apuntes a PDF</button>
    <div id="daily-slot"></div>
    <div id="notes-list" class="accordion"></div>
    <h2 class="screen__subtitle">Errores comunes</h2>
    <div id="misconceptions-list" class="accordion"></div>
  </section>
</template>

<template id="tpl-note-item">
  <article class="accordion__item note-item">
    <button type="button" class="accordion__head" aria-expanded="false">
      <span class="note-item__title"></span>
      <span class="note-item__read-badge" hidden>✓ Leído</span>
      <span class="accordion__chevron">▾</span>
    </button>
    <div class="accordion__body" hidden>
      <div class="note-item__body"></div>
      <a class="note-resource" hidden target="_blank" rel="noopener"></a>
      <label class="note-item__mark"><input type="checkbox" class="note-item__checkbox" /> Marcar como leído</label>
    </div>
  </article>
</template>

<template id="tpl-misconception-item">
  <article class="accordion__item">
    <button type="button" class="accordion__head" aria-expanded="false">
      <span class="misconception-item__title"></span>
      <span class="accordion__chevron">▾</span>
    </button>
    <div class="accordion__body" hidden><p class="misconception-item__text"></p></div>
  </article>
</template>

<template id="tpl-daily-question">
  <div class="daily-card">
    <div class="daily-card__label">Pregunta del día</div>
    <p class="daily-card__question"></p>
    <div class="daily-card__options"></div>
    <p class="daily-card__feedback" hidden></p>
  </div>
</template>

<template id="tpl-cases">
  <section class="screen">
    <h1 class="screen__title">Casos para debatir</h1>
    <div class="mode-toggle">
      <button type="button" class="mode-toggle__btn is-active" data-mode="student">Vista alumno</button>
      <button type="button" class="mode-toggle__btn" data-mode="teacher">Modo profesor</button>
    </div>
    <div id="weekly-case-slot"></div>
    <div id="cases-list" class="accordion"></div>
  </section>
</template>

<template id="tpl-weekly-case">
  <div class="weekly-card">
    <div class="weekly-card__label">⭐ Caso de la semana</div>
    <div class="weekly-card__title"></div>
  </div>
</template>

<template id="tpl-case-item">
  <article class="accordion__item case-item">
    <button type="button" class="accordion__head" aria-expanded="false">
      <span class="case-item__title"></span>
      <span class="accordion__chevron">▾</span>
    </button>
    <div class="accordion__body" hidden>
      <p class="case-item__scenario"></p>
      <button type="button" class="btn btn--ghost case__answer-toggle">Ver respuesta sugerida</button>
      <div class="case__answer" hidden><p></p></div>
      <div class="case__tips" hidden>
        <h3>Tips para guiar el debate</h3>
        <ul></ul>
      </div>
    </div>
  </article>
</template>

<template id="tpl-glossary">
  <section class="screen">
    <h1 class="screen__title">Glosario</h1>
    <div class="mode-toggle">
      <button type="button" class="mode-toggle__btn is-active" data-mode="list">Lista</button>
      <button type="button" class="mode-toggle__btn" data-mode="cards">Tarjetas (repaso)</button>
    </div>
    <input type="search" id="glossary-search" class="glossary-search" placeholder="Buscar término..." />
    <button type="button" class="btn btn--ghost btn--block" id="btn-export-glossary-pdf">Exportar glosario a PDF</button>
    <div id="glossary-list-view"></div>
    <div id="glossary-cards-view" hidden></div>
  </section>
</template>

<template id="tpl-glossary-list">
  <ul class="glossary-list"></ul>
</template>

<template id="tpl-glossary-item">
  <li class="glossary-list__item">
    <div class="glossary-list__term"></div>
    <div class="glossary-list__def"></div>
  </li>
</template>

<template id="tpl-glossary-cards">
  <div class="flashcard-wrap">
    <div class="flashcard" id="flashcard">
      <div class="flashcard__face flashcard__front"></div>
      <div class="flashcard__face flashcard__back" hidden></div>
    </div>
    <div class="flashcard__nav">
      <button type="button" class="btn btn--ghost" id="btn-flash-prev">◀ Anterior</button>
      <span id="flashcard-counter">1 / 1</span>
      <button type="button" class="btn btn--ghost" id="btn-flash-next">Siguiente ▶</button>
    </div>
    <button type="button" class="btn btn--primary btn--block" id="btn-flash-flip">Girar tarjeta</button>
    <button type="button" class="btn btn--ghost btn--block" id="btn-flash-shuffle">Mezclar tarjetas</button>
  </div>
</template>

<template id="tpl-quiz-intro">
  <section class="screen screen--center">
    <h1 class="screen__title">Cuestionario</h1>
    <p class="quiz-intro__best">Mejor puntaje: <strong id="best-score">—</strong></p>
    <p class="quiz-intro__desc">Elegí un modo para empezar. Las opciones de cada pregunta aparecen en orden distinto cada vez.</p>
    <button type="button" class="btn btn--primary btn--block" id="btn-start-practice">Modo práctica</button>
    <button type="button" class="btn btn--secondary btn--block" id="btn-start-exam">Modo examen (8 min)</button>
  </section>
</template>

<template id="tpl-question">
  <section class="screen">
    <div class="quiz-header">
      <div class="quiz-progress"><div class="quiz-progress__bar" id="quiz-progress-bar"></div></div>
      <div class="quiz-header__row">
        <span id="quiz-question-counter"></span>
        <span id="quiz-timer" hidden></span>
      </div>
    </div>
    <p class="quiz-question" id="quiz-question-text"></p>
    <div class="quiz-options" id="quiz-options"></div>
  </section>
</template>

<template id="tpl-option">
  <button type="button" class="quiz-option"></button>
</template>

<template id="tpl-result">
  <section class="screen screen--center">
    <h1 class="screen__title" id="result-title">¡Listo!</h1>
    <p class="result__score" id="result-score"></p>
    <p class="result__detail" id="result-detail"></p>
    <div class="result__actions">
      <button type="button" class="btn btn--ghost" id="btn-share-result">Compartir resultado</button>
      <button type="button" class="btn btn--primary" id="btn-retry">Volver a intentar</button>
    </div>
  </section>
</template>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
